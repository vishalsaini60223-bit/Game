name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Active Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Unable to detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Detected Java version $JAVA_MAJOR is lower than 17."
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR (>= 17)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be verified."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK not found."
            echo "Discovered APKs in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK exists but is empty."
            exit 1
          fi
          if [[ "$TARGET_APK" != *.apk ]]; then
            echo "Error: $TARGET_APK does not have .apk extension."
            exit 1
          fi
          echo "Confirmed valid APK: $TARGET_APK ($(du -h "$TARGET_APK" | cut -f1))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/app-debug.apk"
          echo "asset_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared at: $TMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Debug Build"
          body: |
            Automated debug APK build from commit ${{ github.sha }}.
            
            Direct Download: [app-debug.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ steps.prepare_asset.outputs.asset_path }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
